<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Element Alert</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 500px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      color: #333;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #1a73e8;
    }

    h2 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section {
      margin-bottom: 20px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    button {
      padding: 10px 16px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #1557b0;
    }

    button.secondary {
      background-color: #34a853;
    }

    button.secondary:hover {
      background-color: #2d8e47;
    }

    button.danger {
      background-color: #f44336;
    }

    button.danger:hover {
      background-color: #d32f2f;
    }

    .rule-list {
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .rule-item {
      padding: 12px;
      margin-bottom: 8px;
      background-color: #f5f5f5;
      border-radius: 4px;
      border-left: 4px solid #1a73e8;
    }

    .rule-item.disabled {
      border-left-color: #ccc;
      opacity: 0.6;
    }

    .rule-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .rule-name {
      font-weight: 600;
      color: #333;
      font-size: 15px;
    }

    .rule-actions {
      display: flex;
      gap: 5px;
    }

    .rule-actions button {
      padding: 4px 8px;
      font-size: 12px;
    }

    .rule-details {
      font-size: 12px;
      color: #666;
      line-height: 1.6;
    }

    .rule-details div {
      margin-bottom: 4px;
    }

    .rule-details strong {
      color: #444;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      width: 450px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #555;
    }

    .form-group input[type="text"],
    .form-group input[type="number"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    .form-group input:focus {
      outline: none;
      border-color: #1a73e8;
    }

    .form-group .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
    }

    .status.success {
      background-color: #e8f5e9;
      color: #2e7d32;
    }

    .status.error {
      background-color: #ffebee;
      color: #c62828;
    }

    .status.info {
      background-color: #e3f2fd;
      color: #1565c0;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: #999;
    }

    .settings-section {
      border-top: 1px solid #e0e0e0;
      padding-top: 15px;
      margin-top: 15px;
    }

    input[type="range"] {
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>Element Alert</h1>

  <div class="section">
    <h2>監視ルール</h2>
    <div class="button-group">
      <button id="addRuleBtn" class="secondary">ルールを追加</button>
      <button id="selectElementBtn" class="secondary">要素を選択</button>
    </div>

    <div id="ruleList" class="rule-list">
      <div class="empty-state">監視ルールがありません</div>
    </div>
  </div>

  <div class="settings-section">
    <h2>音声設定</h2>
    <div class="checkbox-group">
      <input type="checkbox" id="soundEnabled" checked>
      <label for="soundEnabled" style="margin-bottom: 0;">通知音を有効にする</label>
    </div>

    <div style="margin-top: 15px;">
      <label for="soundType">通知音の種類</label>
      <select id="soundType" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
        <option value="bell">ベル（柔らかい上昇音）</option>
        <option value="ping">ピンポン（高い2音）</option>
        <option value="coin">コイン（短い高音）</option>
        <option value="alert">アラート（警告音）</option>
        <option value="beep">ビープ（3回連続）</option>
        <option value="soft">ソフト（柔らかい低音）</option>
        <option value="high">ハイトーン（高い持続音）</option>
        <option value="low">ロートーン（低い2音）</option>
        <option value="trill">トリル（上昇音階）</option>
        <option value="chime">チャイム（和音）</option>
      </select>
    </div>

    <div style="margin-top: 10px;">
      <label for="volume">音量: <span id="volumeValue">50</span>%</label>
      <input type="range" id="volume" min="0" max="100" value="50">
    </div>
    <button id="testSoundBtn" style="margin-top: 10px; width: 100%;">選択した音をテスト</button>
  </div>

  <div id="status" class="status" style="display: none;"></div>

  <!-- ルール追加/編集モーダル -->
  <div id="ruleModal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle">ルールを追加</h2>

      <div class="form-group">
        <label for="ruleName">ルール名</label>
        <input type="text" id="ruleName" placeholder="例: 価格監視, 在庫状況">
        <div class="help-text">任意の名前をつけられます</div>
      </div>

      <div class="form-group">
        <label for="ruleUrl">URLパターン</label>
        <input type="text" id="ruleUrl" placeholder="例: https://example.com/*">
        <div class="help-text">* でワイルドカード指定が可能です</div>
      </div>

      <div class="form-group">
        <label for="ruleSelector">CSSセレクタ</label>
        <input type="text" id="ruleSelector" placeholder="例: #price, .stock-status">
        <div class="help-text">監視するDOM要素のセレクタ</div>
      </div>

      <div class="form-group">
        <label for="ruleInterval">チェック間隔（ミリ秒）</label>
        <input type="number" id="ruleInterval" min="500" max="60000" step="500" value="1000">
        <div class="help-text">デフォルト: 1000ms = 1秒</div>
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="ruleEnabled" checked>
        <label for="ruleEnabled" style="margin-bottom: 0;">このルールを有効にする</label>
      </div>

      <div class="modal-buttons">
        <button id="cancelBtn">キャンセル</button>
        <button id="saveRuleBtn" class="secondary">保存</button>
      </div>
    </div>
  </div>

  <script src="popup-v2.js"></script>
</body>
</html>
